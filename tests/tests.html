<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tests Patient Zéro</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; background: #fff; color: #1d1d1f; }
  .ok { color: #1e6b3e; } .echec { color: #9b2f1c; font-weight: 600; }
</style>
</head>
<body>
<h1 id="bilan">Tests en cours…</h1>
<ul id="resultats"></ul>
<!-- attendu.js est produit par generateur/generer.py : lancer le générateur avant d'ouvrir cette page. -->
<script src="../donnees.js"></script>
<script src="attendu.js"></script>
<script src="../js/recherche.js"></script>
<script src="../js/enquete.js"></script>
<script>
(async function () {
  'use strict';
  const R = window.Recherche, E = window.Enquete;
  let echecs = 0, total = 0;

  function test(nom, condition, detail) {
    total++;
    if (!condition) echecs++;
    const li = document.createElement('li');
    li.className = condition ? 'ok' : 'echec';
    li.textContent = (condition ? 'OK ' : 'ÉCHEC ') + nom + (condition || !detail ? '' : ' : ' + detail);
    document.getElementById('resultats').appendChild(li);
  }

  function contient(texte, termes, options) {
    return R.evaluer(R.preparer(texte), [R.compilerCritere(Object.assign({ termes }, options))]);
  }

  // --- Moteur de recherche --------------------------------------------------------------------------------
  test('accents et majuscules', contient('Réflexe rotulien ABOLI.', ['reflexe rotulien aboli']));
  test('début de mot : ROT trouve rotulien', contient('Réflexe rotulien aboli.', ['ROT']));
  test('début de mot seulement : otulien ne trouve pas rotulien', !contient('Réflexe rotulien aboli.', ['otulien']));
  test('chaque mot du terme est un début de mot', contient('Réflexe rotulien aboli.', ['reflex rot abol'])
    && !contient('Réflexe rotulien présent.', ['rot abol']));
  test('étoile finale ignorée : rouge* trouve rougeole', contient('Suspicion de rougeole.', ['rouge*']));
  test('pluriel dans les deux sens', contient('Plaques rouges douloureuses.', ['plaque rouge douloureuse'])
    && contient('ROT aboli.', ['ROT abolis']));
  test('apostrophe', contient("Pas d'antécédent notable.", ["pas d'antecedent"]));
  test('trait d\'union', contient('Éruption maculo-papuleuse.', ['maculo papuleuse'])
    && contient('Éruption maculo papuleuse.', ['maculo-papuleuse']));
  test('ligature œ', contient('Œdème local.', ['oedeme']));
  test('un terme ne traverse pas une fin de phrase', !contient('Plaques rouges. Douloureuses.', ['rouges douloureuses']));
  const decoupe = R.preparer('Fièvre à 40,6 °C. PRD.').mots.map(m => m.phrase + ':' + m.forme).join(' ');
  test('décimale avec virgule : pas de fin de phrase', decoupe === '0:fievre 0:a 0:40 0:6 0:c 1:prd', decoupe);

  const prd = { termes: ['PRD'], phrase: 'A' };
  const negation = { termes: ['pas de', 'absence de'], exclure: true, phrase: 'A' };
  const evaluer = (texte, criteres) => R.evaluer(R.preparer(texte), criteres.map(R.compilerCritere));
  test('même phrase : signe affirmé gardé', evaluer('Pas de toux. PRD diffuses.', [prd, negation]));
  test('même phrase : signe nié écarté', !evaluer('Pas de PRD. Toux.', [prd, negation]));
  test('exclusion globale', !evaluer('PRD diffuses. Pas de toux.', [{ termes: ['PRD'] }, { termes: ['pas de'], exclure: true }]));
  test('lien sans inclusion : exclusion globale', !evaluer('Toux. Pas de PRD.', [{ termes: ['PRD'], exclure: true, phrase: 'B' }]));
  test('critère vide ignoré', evaluer('Toux.', [{ termes: ['', '  '] }]));

  const prep = R.preparer('ROT présents. Réflexe rotulien aboli.');
  const html = R.surligner(prep, [R.compilerCritere({ termes: ['reflexe rotulien aboli'] })], ['#ff0']);
  test('surlignage exact, accents conservés', html.includes('<mark style="background:#ff0">Réflexe rotulien aboli</mark>'), html);
  const html2 = R.surligner(R.preparer('Pas de PRD.'), [prd, negation].map(R.compilerCritere), ['#ff0']);
  test('surlignage des exclusions', html2.includes('<mark class="exclu">Pas de</mark>') && html2.includes('>PRD</mark>'), html2);
  test('identifiant saisi', E.normaliserId(' p647 ') === 'P0647' && E.normaliserId('P0647') === 'P0647' && E.normaliserId('abc') === null);

  // --- Données générées ------------------------------------------------------------------------------------
  const A = window.ATTENDU;
  const base = E.charger(window.DONNEES);
  await E.preparerVerite(base);
  const ids = etat => E.entonnoir(base, Object.assign(E.etatVide(), etat)).lignes.map(v => v.id_visite);
  const memes = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
  const ecart = (a, b) => `obtenu ${a.length}, attendu ${b.length}`;

  // Formes des signes du virus, décrites dans docs/scenario.md. Elles ne figurent volontairement pas dans le jeu.
  const SIGNES_PLAQUES = ['plaques rouges douloureuses', 'PRD', 'plaques rouges dlr'];
  const NEGATIONS = ['pas de', 'absence de'];
  const plaques = { termes: SIGNES_PLAQUES };
  const plaquesAffirmees = [{ termes: SIGNES_PLAQUES, phrase: 'A' }, { termes: NEGATIONS, exclure: true, phrase: 'A' }];
  const reflexe = { termes: ['réflexe rotulien aboli', 'absence de réflexe rotulien', 'ROT abolis'] };
  const requetes = {
    temperature_40: { temperatureMin: '40' },
    plaques_forme0: { criteres: [{ termes: ['plaques rouges douloureuses'] }] },
    plaques_toutes_formes: { criteres: [plaques] },
    plaques_affirmees: { criteres: plaquesAffirmees },
    reflexe_aboli: { criteres: [reflexe] },
    karovia: { criteres: [{ termes: ['Karovia'] }] },
    trois_signes: { temperatureMin: '40', criteres: [...plaquesAffirmees, reflexe] },
  };
  for (const [nom, etat] of Object.entries(requetes)) {
    const obtenu = ids(etat);
    test(`requête « ${nom} » = ce que le générateur a écrit`, memes(obtenu, A[nom]), ecart(obtenu, A[nom]));
  }

  test('autant de missions que de réponses calculées par le générateur', E.MISSIONS.length === A.missions.length);
  E.MISSIONS.forEach((m, i) => {
    const obtenu = E.reponseMission(base, m);
    test(`mission ${i + 1} : réponse = calcul du générateur`, obtenu === A.missions[i][1], `obtenu ${obtenu}, attendu ${A.missions[i][1]}`);
  });
  const textesMissions = JSON.stringify(E.MISSIONS).toLowerCase();
  const indices = ['plaque', 'prd', 'rotulien', 'rot ', 'karovia', 'bordeaux', 'temperature', 'nova', 'fièvre', 'zéro'];
  test('les missions ne donnent aucune piste sur le virus', indices.every(m => !textesMissions.includes(m)),
    indices.filter(m => textesMissions.includes(m)).join(', '));
  const missionNegation = E.MISSIONS[E.MISSIONS.length - 1];
  const sansLien = { criteres: missionNegation.etat.criteres.map(c => Object.assign({}, c, { phrase: '' })) };
  const brut = { criteres: missionNegation.etat.criteres.filter(c => !c.exclure) };
  const avecLien = E.reponseMission(base, missionNegation);
  test('mission négation : le lien de phrase change le résultat',
    ids(sansLien).length < avecLien && avecLien < ids(brut).length, `sans lien ${ids(sansLien).length}, avec ${avecLien}, brut ${ids(brut).length}`);

  const premierPatient = etat => E.entonnoir(base, Object.assign(E.etatVide(), etat)).lignes[0].id_patient;
  const pz = premierPatient(requetes.trois_signes);
  test('la première visite avec les trois signes est celle du patient zéro', pz === A.patient_zero, pz);
  test('le jeu reconnaît le patient zéro', (await E.verifierProposition(base, pz)).statut === 'zero');
  const bilan = await E.dechiffrerBilan(base, pz);
  test('le bilan se déchiffre avec la bonne réponse', bilan.startsWith(`## Le patient zéro est ${pz}`), bilan.slice(0, 60));
  test('le bilan contient le lexique', bilan.includes('## Ce que vous avez fait'));
  test('le bilan parle de rappel et de précision', bilan.includes('rappel') && bilan.includes('précision')
    && !/sensibilit|spécificit/i.test(bilan));
  const vecteur = A.vecteur_animateur;
  test('mot de passe animateur : le navigateur déchiffre comme le générateur',
    await E.ouvrirBilanAnimateur(base, vecteur.mot_de_passe, vecteur.code) === '## Le patient zéro est P0000');
  test('mot de passe animateur faux : bilan fermé', await E.ouvrirBilanAnimateur(base, 'mauvais mot de passe') === null);

  const marches = E.entonnoir(base, Object.assign(E.etatVide(), requetes.trois_signes)).marches;
  const fin = marches[marches.length - 1];
  const partMalades = A.trois_signes.length / base.visites.length;
  test('sans filtre : rappel 100 %, précision = part des visites de malades',
    marches[0].rappel === 1 && marches[0].precision === partMalades, `${marches[0].rappel} / ${marches[0].precision}`);
  test('les trois signes : rappel et précision de 100 %', fin.rappel === 1 && fin.precision === 1,
    `${fin.rappel} / ${fin.precision}`);
  test('entonnoir : chaque étape écarte exactement les visites qu\'elle perd', marches[0].ecartees.length === 0
    && marches.slice(1).every((m, k) => m.ecartees.length === marches[k].visites - m.visites),
    marches.map(m => `${m.visites} (−${m.ecartees.length})`).join(' → '));
  const fievre = E.entonnoir(base, Object.assign(E.etatVide(), requetes.temperature_40)).marches[1];
  test('fièvre seule : tous les malades (rappel 100 %), mais aussi des non-malades (précision < 100 %)',
    fievre.rappel === 1 && fievre.precision < 1, `${fievre.rappel} / ${fievre.precision}`);
  const deuxSignes = {
    'fièvre et plaques': { temperatureMin: '40', criteres: plaquesAffirmees },
    'fièvre et réflexe': { temperatureMin: '40', criteres: [reflexe] },
    'plaques et réflexe': { criteres: [...plaquesAffirmees, reflexe] },
  };
  for (const [nom, etat] of Object.entries(deuxSignes)) {
    const m = E.entonnoir(base, Object.assign(E.etatVide(), etat)).marches.at(-1);
    test(`deux signes (${nom}) : tous les malades, et des non-malades`, m.rappel === 1 && m.precision < 1,
      `${m.rappel} / ${m.precision}`);
  }
  const sansReflexe = ids(deuxSignes['fièvre et plaques']).filter(id => !A.trois_signes.includes(id));
  const ecarteesReflexe = fin.ecartees.map(v => v.id_visite);
  test('non sélectionnés à la dernière étape : les visites avec fièvre et plaques, sans le réflexe',
    sansReflexe.length > 0 && memes(ecarteesReflexe, sansReflexe), ecart(ecarteesReflexe, sansReflexe));
  const positif = E.entonnoir(base, Object.assign(E.etatVide(), { test: 'positif' })).marches[1];
  test('test positif : que des malades (précision 100 %), mais pas tous, des malades n\'ont pas eu le test (rappel < 100 %)',
    positif.precision === 1 && positif.rappel < 1, `${positif.rappel} / ${positif.precision}`);
  const vide = E.entonnoir(base, Object.assign(E.etatVide(), { temperatureMin: '45' })).marches[1];
  test('sélection vide : rappel 0 %, précision non définie', vide.visites === 0 && vide.rappel === 0 && vide.precision === null,
    `${vide.visites} visites, ${vide.rappel} / ${vide.precision}`);
  test('des malades sans test après T0 (le test arrive plus tard dans certains CHU)',
    base.visites.some(v => v.malade && v.date >= base.meta.t0 && v.test_nova === 'non disponible'));

  const bonus = async (saisie, lignes = []) => (await E.verifierNombreMalades(base, saisie, lignes)).statut;
  const selectionParfaite = E.entonnoir(base, Object.assign(E.etatVide(), requetes.trois_signes)).lignes;
  test('question bonus : le nombre de patients malades est accepté', await bonus(String(A.malades.length)) === 'juste');
  test('question bonus : le nombre de visites des malades est signalé',
    A.trois_signes.length !== A.malades.length && await bonus(String(A.trois_signes.length)) === 'visites');
  test('question bonus : nombre faux avec une sélection parfaite', await bonus('1', selectionParfaite) === 'lire');
  test('question bonus : nombre faux avec une sélection incomplète', await bonus('1', base.visites) === 'selection');
  test('question bonus : saisie qui n\'est pas un nombre', await bonus('beaucoup') === 'format');
  test('la liste des empreintes ne donne pas le nombre de malades', base.verification.malades.length !== A.malades.length);

  const statut = async etat => (await E.verifierProposition(base, premierPatient(etat))).statut;
  test('piège de la négation : Karovia + plaques sans lien de phrase → non-malade',
    await statut({ temperatureMin: '40', criteres: [{ termes: ['Karovia'] }, plaques] }) === 'sain');
  test('piège des signes incomplets : fièvre + plaques sans réflexe → non-malade',
    await statut({ temperatureMin: '40', criteres: plaquesAffirmees }) === 'sain');
  test('piège des synonymes : formes complètes seulement → malade contaminé en France',
    await statut({ temperatureMin: '40', criteres: [{ termes: ['plaques rouges douloureuses'], phrase: 'A' },
      { termes: NEGATIONS, exclure: true, phrase: 'A' }, { termes: ['réflexe rotulien aboli'] }] }) === 'malade');
  test('tous les malades sont reconnus', (await Promise.all(A.malades.map(id => E.verifierProposition(base, id))))
    .every(r => r.statut === 'malade' || r.id === A.patient_zero));
  test('identifiant inconnu', (await E.verifierProposition(base, 'P9999')).statut === 'inconnu');

  const semaines = E.courbe(base);
  test('courbe vide avant T0', semaines.filter(s => s.lundi < base.meta.t0).every(s => s.cas === 0));
  test('courbe : un cas par malade détecté', semaines.reduce((n, s) => n + s.cas, 0)
    === new Set(base.visites.filter(v => v.test_nova === 'positif').map(v => v.id_patient)).size);
  test('en-tête cohérent : un patient, un hôpital', base.patients.every(p =>
    new Set(base.visites.filter(v => v.id_patient === p.id_patient).map(v => v.hopital)).size <= 1));

  document.getElementById('bilan').textContent = echecs ? `ÉCHEC : ${echecs} sur ${total}` : `OK : ${total} tests`;
  document.title = echecs ? 'ECHEC' : 'OK';
})().catch(e => {
  document.getElementById('bilan').textContent = 'ÉCHEC : ' + e;
  document.title = 'ECHEC';
});
</script>
</body>
</html>
